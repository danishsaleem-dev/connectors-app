name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Single-ABI (arm64 — virtually every phone from the last ~6 years) so
      # this ships one ~20-25MB APK instead of a "fat" universal one bundling
      # arm64 + armv7 + x86_64 native code, which is what made the first
      # build 70+MB for an app this size.
      - run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: connectors-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
